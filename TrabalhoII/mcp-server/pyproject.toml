[project]
name = "receitas-mcp-server"
version = "0.1.0"
description = "Servidor MCP (stdio) do Assistente Inteligente de Receitas: search_knowledge, get_document, list_topics"
requires-python = ">=3.11"
dependencies = [
    # Testado com mcp 2.3.0 (linha v2: MCPServer substitui FastMCP da v1).
    "mcp==2.3.0",
    "pydantic>=2.11,<3",
    "anyio>=4.5,<5",
]
# As dependências do RAG (chromadb, sentence-transformers) devem ser instaladas neste
# mesmo ambiente, pois o servidor importa `rag.retrieve`. Ver README.

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "tools", "models", "store"]
