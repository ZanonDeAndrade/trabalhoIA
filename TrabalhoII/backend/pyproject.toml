[project]
name = "receitas-backend"
version = "0.1.0"
description = "Backend FastAPI do Assistente Inteligente de Receitas"
requires-python = ">=3.11"
dependencies = [
    # Cliente MCP (app/integrations/mcp_client.py). Mesma versão do servidor em mcp-server/.
    "mcp==2.3.0",
    "anyio>=4.5,<5",
    "jsonschema>=4.20",
    # Demais dependências do backend (fastapi, uvicorn, cliente Ollama...) são adicionadas
    # pela equipe do backend.
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
